<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="اختبار تدريبي ومراجعة لكتاب مهارات الكتابة (100 عرب): الهمزة، الحذف والزيادة، الألف اللينة والتاء والهاء، التحرير والترقيم، كتابة الفقرة.">
<title>اختبار مهارات الكتابة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0}
img{max-width:100%}
:root{
  --bg:#f3f5f9; --paper:#ffffff; --ink:#172030; --muted:#5a6578; --line:#dbe1ea; --soft:#eef2f8;
  --accent:#1f4f8f; --accent-ink:#ffffff; --accent-soft:#e2ebf8;
  --red:#c0271f; --red-soft:#fdeceb; --green:#1f7a47; --green-soft:#e5f4eb;
  --amber:#8f5a00; --amber-soft:#fcf1dc; --wasl:#1f4f8f; --wasl-soft:#e2ebf8;
  --shadow:0 1px 2px rgba(20,32,55,.05),0 6px 18px rgba(20,32,55,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e131a; --paper:#151c26; --ink:#e6ebf2; --muted:#9ba7b9; --line:#29333f; --soft:#1b2430;
    --accent:#8fb5ee; --accent-ink:#0e131a; --accent-soft:#1d2b41;
    --red:#ff8f86; --red-soft:#3a1c1b; --green:#7fd8a5; --green-soft:#15301f;
    --amber:#f1c276; --amber-soft:#33280f; --wasl:#8fb5ee; --wasl-soft:#1d2b41; --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e131a; --paper:#151c26; --ink:#e6ebf2; --muted:#9ba7b9; --line:#29333f; --soft:#1b2430;
  --accent:#8fb5ee; --accent-ink:#0e131a; --accent-soft:#1d2b41;
  --red:#ff8f86; --red-soft:#3a1c1b; --green:#7fd8a5; --green-soft:#15301f;
  --amber:#f1c276; --amber-soft:#33280f; --wasl:#8fb5ee; --wasl-soft:#1d2b41; --shadow:none;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;font-size:16px;line-height:1.8;padding-inline:16px;padding-block:0 110px}
.wrap{max-width:860px;margin-inline:auto}
h1,h2,h3{text-wrap:balance;line-height:1.4;margin:0}
.w,.amiri{font-family:Amiri,"Traditional Arabic",serif;font-weight:700;font-size:1.16em}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label:focus-within,.tok:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin-inline:-16px;padding:9px 16px}
.top .wrap{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.brand{display:flex;flex-direction:column;line-height:1.35}
.brand b{font-size:1rem}
.brand small{color:var(--muted);font-size:.78rem}
.hbtns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;font-size:.86rem;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.timer{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.02em;direction:ltr}
.timer.low{color:var(--red);border-color:var(--red);background:var(--red-soft)}

/* generic */
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px;margin-block:18px;box-shadow:var(--shadow)}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 16px;font-weight:600;font-size:.93rem}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn:disabled{opacity:.45;cursor:default}
.row-btns{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hint{font-size:.86rem;color:var(--muted)}
.lbl{font-size:.8rem;font-weight:700;color:var(--accent);letter-spacing:.01em}

/* home */
.hero{display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:14px}
.hero h1{font-size:1.5rem}
.facts{display:grid;grid-template-columns:auto auto;gap:2px 14px;font-size:.9rem;color:var(--muted);align-content:start}
.facts b{color:var(--ink)}
.parts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-block:14px}
.parts div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--soft)}
.parts b{display:block}
.parts span{font-size:.84rem;color:var(--muted)}
.rules-list{margin:0;padding-inline-start:20px}
.homecards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:6px}
.homecards button{text-align:start;border:1px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.homecards b{color:var(--accent);font-size:1.02rem}
.homecards span{font-size:.84rem;color:var(--muted);line-height:1.5}
.jumpbar{display:flex;flex-wrap:wrap;gap:6px;margin-block:12px}
.jumpbar button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;font-size:.85rem;font-weight:600}
.rules .card,.prep .card{scroll-margin-top:80px}
.unit{font-size:1.2rem;margin-block:26px 0;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.tplform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;margin-block:10px}
.tplform label{display:flex;flex-direction:column;gap:2px;font-size:.82rem;color:var(--muted)}
.tplform input.ar{max-width:none;font-size:1.1rem}
.tplout{font-family:Amiri,"Traditional Arabic",serif;font-size:1.3rem;line-height:2.3;background:var(--soft);border-radius:10px;padding:12px 16px;text-indent:2em;text-align:justify}
.tplout mark{background:var(--amber-soft);color:var(--amber);border-radius:4px;padding:0 3px}
.steps{margin:0;padding-inline-start:22px}
.steps li{margin-block:4px}
.setq{font-size:1rem;margin-block:14px 8px}
.choice{display:flex;flex-wrap:wrap;gap:8px}
.choice button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 18px;font-weight:600;font-size:.95rem;font-variant-numeric:tabular-nums}
.choice button:hover{border-color:var(--accent)}
.choice button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rules-list li{margin-block:3px}
.field{display:flex;flex-direction:column;gap:4px;max-width:360px;margin-block:14px}
.field label{font-weight:600;font-size:.9rem}
.field input{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
table.hist{width:100%;border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums}
table.hist th,table.hist td{padding:8px;border-bottom:1px solid var(--line);text-align:start}
table.hist th{font-size:.8rem;color:var(--muted)}
.tablebox{overflow-x:auto}

/* exam */
.pagehead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px;margin-top:18px}
.pagehead h2{font-size:1.15rem}
.progress{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:var(--accent)}
.qcard{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin-block:16px;box-shadow:var(--shadow)}
.qh{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.qn{font-weight:700}
.qt{font-size:.82rem;color:var(--muted)}
.tag{font-size:.74rem;font-weight:700;color:var(--amber);background:var(--amber-soft);border-radius:999px;padding:1px 10px}
.flag{margin-inline-start:auto;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:2px 12px;font-size:.8rem;font-weight:600;color:var(--muted)}
.flag[aria-pressed="true"]{color:var(--amber);border-color:var(--amber);background:var(--amber-soft)}
.qb{padding:14px 18px 16px}
.stem{font-weight:600;margin-bottom:10px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;background:var(--paper);position:relative}
.opt:hover{border-color:var(--accent)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .ol{flex:none;width:1.6em;height:1.6em;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:700;margin-top:2px}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt:has(input:checked) .ol{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rv .opt{cursor:default}
.rv .opt.right{border-color:var(--green);background:var(--green-soft)}
.rv .opt.right .ol{background:var(--green);color:var(--paper);border-color:var(--green)}
.rv .opt.wrong{border-color:var(--red);background:var(--red-soft)}
.rv .opt.wrong .ol{background:var(--red);color:var(--paper);border-color:var(--red)}
.pair{display:flex;gap:8px}
.pair button,.seats button{border:1px solid var(--line);background:var(--paper);border-radius:8px;font-weight:700}
.pair button{padding:6px 22px}
.pair button[aria-pressed="true"],.seats button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rv .pair button,.rv .seats button{cursor:default}
.pair button.right,.seats button.right{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.pair button.wrong,.seats button.wrong{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.seats{display:flex;flex-wrap:wrap;gap:6px}
.seats button{width:46px;height:46px;font-family:Amiri,serif;font-size:1.45rem;line-height:1}
.ctx{font-family:Amiri,"Traditional Arabic",serif;font-size:1.32rem;margin-bottom:10px}
.seatword{color:var(--accent);padding:0 4px;border-bottom:2px dotted var(--accent);font-weight:700;font-size:1.1em}
.letters{font-family:Amiri,"Traditional Arabic",serif;font-size:1.45rem;font-weight:700;margin-bottom:8px}
input.ar,textarea.ar,select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 10px;width:100%}
input.ar{font-family:Amiri,"Traditional Arabic",serif;font-size:1.3rem;font-weight:700;padding-block:2px;max-width:340px}
textarea.ar{min-height:130px;resize:vertical;line-height:1.8}
.right-in{border-color:var(--green)!important;background:var(--green-soft)!important}
.wrong-in{border-color:var(--red)!important;background:var(--red-soft)!important}
.conv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.7fr) minmax(0,1.5fr);gap:8px;align-items:end}
.conv label{display:flex;flex-direction:column;gap:2px;font-size:.78rem;color:var(--muted)}
.conv input.ar{max-width:none}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.tools button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 14px;font-weight:600;font-size:.9rem}
.tools button[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px}
.tools .tw{color:var(--wasl);background:var(--wasl-soft);border-color:var(--wasl)}
.tools .tq{color:var(--amber);background:var(--amber-soft);border-color:var(--amber)}
.passage{font-family:Amiri,"Traditional Arabic",serif;font-size:1.35rem;line-height:2.5;background:var(--soft);border-radius:10px;padding:12px 16px;text-align:justify}
.tok{cursor:pointer;border-radius:4px;padding:0 2px;border-bottom:2px solid transparent}
.tok:hover{background:var(--paper)}
.tok.w,.tok.m{background:var(--wasl-soft);color:var(--wasl);border-bottom-color:var(--wasl)}
.tok.q{background:var(--amber-soft);color:var(--amber);border-bottom-color:var(--amber)}
.tok.flagged{background:var(--red-soft);color:var(--red);border-bottom:2px wavy var(--red)}
.tok sup{font-family:"IBM Plex Sans Arabic",sans-serif;font-size:.55rem;font-weight:700;margin-inline-start:2px}
.rv .tok{cursor:default}
.tok.g-ok{outline:2px solid var(--green);outline-offset:1px}
.tok.g-bad{outline:2px solid var(--red);outline-offset:1px}
.tok.g-miss{outline:2px dashed var(--red);outline-offset:1px}
.tok.g-fp{text-decoration:line-through;text-decoration-color:var(--red)}
.fixlist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.fixrow{display:grid;grid-template-columns:minmax(0,.8fr) auto minmax(0,1.4fr);gap:10px;align-items:center}
.fixrow .from{font-family:Amiri,serif;font-size:1.25rem;font-weight:700;color:var(--red)}
.fb{border-top:1px dashed var(--line);padding:12px 18px 14px;font-size:.92rem;display:flex;flex-direction:column;gap:6px;background:var(--soft);border-radius:0 0 12px 12px}
.fb .st{font-weight:700}
.fb .st.ok{color:var(--green)}
.fb .st.bad{color:var(--red)}
.fb .st.part,.fb .st.pend{color:var(--amber)}
.fb .src{font-size:.82rem;color:var(--muted);border-inline-start:3px solid var(--accent);padding-inline-start:10px}
.fb .src b{color:var(--ink)}
.c{color:var(--green)}
.keylist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.keylist ol{margin:0;padding-inline-start:20px}
.legend{font-size:.82rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.legend span::before{content:"";display:inline-block;width:.85em;height:.85em;border-radius:3px;margin-inline-end:5px;vertical-align:-2px}
.legend .l1::before{outline:2px solid var(--green)}
.legend .l2::before{outline:2px solid var(--red)}
.legend .l3::before{outline:2px dashed var(--red)}
.model{background:var(--green-soft);border-radius:8px;padding:10px 12px}
.checks{display:flex;flex-direction:column;gap:4px}
.checks label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.checks input{margin-top:6px;accent-color:var(--green)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-block:18px}

/* navigator */
.nav{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:14px}
.nav h3{font-size:.9rem;margin-block:8px 6px}
.nav h3:first-child{margin-top:0}
.grid{display:flex;flex-wrap:wrap;gap:5px}
.grid button{width:38px;height:34px;border:1px solid var(--line);background:var(--paper);border-radius:6px;font-size:.82rem;font-weight:600;font-variant-numeric:tabular-nums;position:relative}
.grid button.ans{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.grid button.cur{outline:2px solid var(--ink);outline-offset:1px}
.grid button.fl::after{content:"";position:absolute;top:2px;inset-inline-end:2px;width:7px;height:7px;border-radius:50%;background:var(--amber)}
.grid button.g-ok{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.grid button.g-bad{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.grid button.g-part{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.navkey{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--muted);margin-top:10px}

/* result */
.score{font-family:"Aref Ruqaa",Amiri,serif;color:var(--red);font-size:3.2rem;line-height:1}
.resgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-block:14px}
.resgrid div{background:var(--soft);border-radius:10px;padding:10px 12px}
.resgrid b{display:block;font-size:1.3rem;font-variant-numeric:tabular-nums}
.resgrid span{font-size:.8rem;color:var(--muted)}
.bar{height:6px;background:var(--soft);border-radius:4px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--accent)}
.notice{background:var(--amber-soft);color:var(--ink);border:1px solid var(--amber);border-radius:10px;padding:10px 14px;font-size:.92rem}

/* rules */
.rules h2{font-size:1.15rem;margin-bottom:8px;color:var(--accent)}
.rules h3{font-size:1rem;margin-block:12px 4px}
.rules p{margin-block:4px}
.rules table{border-collapse:collapse;width:100%;font-size:.92rem;margin-block:6px}
.rules td,.rules th{border:1px solid var(--line);padding:6px 10px;text-align:start;vertical-align:top}
.rules th{background:var(--soft)}
.pg{font-size:.76rem;font-weight:700;color:var(--muted);background:var(--soft);border-radius:999px;padding:1px 8px;white-space:nowrap}

/* keyboard */
.kbd{position:fixed;inset-inline:0;bottom:0;z-index:30;background:var(--paper);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:6px;justify-content:center;box-shadow:0 -4px 16px rgba(0,0,0,.08)}
.kbd span{font-size:.8rem;color:var(--muted);align-self:center}
.kbd button{min-width:42px;height:42px;border:1px solid var(--line);background:var(--soft);border-radius:8px;font-family:Amiri,serif;font-size:1.4rem;font-weight:700;line-height:1}

@media (max-width:640px){
  .opts{grid-template-columns:1fr}
  .conv{grid-template-columns:1fr 1fr}
  .conv label:last-child{grid-column:1/-1}
  .parts{grid-template-columns:1fr}
  .homecards,.tplform{grid-template-columns:1fr}
  .resgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .keylist{grid-template-columns:1fr}
  .fixrow{grid-template-columns:1fr}
  .fixrow .arrow{display:none}
  .passage{font-size:1.2rem;padding:10px 12px}
  .brand small{display:none}
}
@media (prefers-reduced-motion:no-preference){.opt,.tok,.btn,.grid button{transition:background-color .15s,border-color .15s}}
</style>
</head>
<body>
<div dir="rtl" lang="ar">
<header class="top"><div class="wrap">
  <div class="brand"><b>مهارات الكتابة</b><small>اختبار تدريبي · مراجعة القواعد · الاستعداد للاختبار</small></div>
  <div class="hbtns" id="hbtns"></div>
</div></header>
<main class="wrap" id="app"></main>
<div class="kbd" id="kbd" hidden><span>حروف الهمزة:</span>
  <button data-ch="أ">أ</button><button data-ch="إ">إ</button><button data-ch="آ">آ</button><button data-ch="ء">ء</button><button data-ch="ؤ">ؤ</button><button data-ch="ئ">ئ</button><button data-ch="ا">ا</button><button data-ch="ى">ى</button><button data-ch="ة">ة</button><button data-ch="ً">ـً</button>
</div>
</div>

<template id="rulesTpl">
<div class="rules">
  <h2 class="unit" id="r-hamza">الهمزة <span class="pg">ص 17–38</span></h2>
  <div class="card">
    <h2>همزة الوصل <span class="pg">ص 17–18</span></h2>
    <p><b>تعريفها:</b> تُرسم ألفًا غير مهموزة (ا)، وتُنطق عند الابتداء بها (<span class="w">افتح الكتاب</span>)، ولا تُنطق عند وصلها بما قبلها (<span class="w">الكتاب افتح</span>). وسُمّيت همزة وصل لأنه يُتوصَّل بها إلى النطق بالساكن.</p>
    <table>
      <tr><th>النوع</th><th>الموضع</th><th>أمثلة الكتاب</th></tr>
      <tr><td>الحروف</td><td>«أل» التعريف</td><td class="amiri">الكتاب، الجامعة، السعودية</td></tr>
      <tr><td>الأسماء</td><td>الأسماء المسموعة: اسم، ابن، ابنة، امرؤ، امرأة، اثنان، اثنتان. وصلٌ في الإفراد والتثنية فقط، وقطعٌ في الجمع (أسماء، أبناء).</td><td class="amiri">اسمي سالم، هذا ابن أخي، امرؤ القيس شاعر جاهلي</td></tr>
      <tr><td rowspan="3">الأفعال</td><td>أمر الفعل الثلاثي</td><td class="amiri">اركع، اسجد، ارجع، اكتب</td></tr>
      <tr><td>ماضي الخماسي وأمره ومصدره</td><td class="amiri">انتصَر، انتصِر، انتصار · ارتجل، ارتجِل، ارتجال</td></tr>
      <tr><td>ماضي السداسي وأمره ومصدره</td><td class="amiri">استغفَر، استغفِر، استغفار · استقام، استقِم، استقامة</td></tr>
    </table>
    <h3>التسمية بكلمة همزتها وصل <span class="pg">ص 18–19</span></h3>
    <p>• <b>فعل أو حرف</b> صار علمًا ← همزته <b>قطع</b> (خرج عن جنسه إلى الاسمية): <span class="w">هذا إعلم · «أل» حرف تعريف</span>.</p>
    <p>• <b>اسم</b> صار علمًا ← همزته تبقى <b>وصلًا</b> (لم يخرج عن جنسه): <span class="w">سلّمت على ابتسام</span>.</p>
  </div>
  <div class="card">
    <h2>همزة القطع <span class="pg">ص 19–20</span></h2>
    <p><b>تعريفها:</b> تُنطق في الابتداء وفي الوصل (<span class="w">أحمد شاعر · شاعر أحمد</span>)، وتُكتب فوق الألف مع الفتح والضم (<span class="w">أرسَل، أُرسِل</span>) وتحتها مع الكسر (<span class="w">إرسال</span>).</p>
    <table>
      <tr><th>النوع</th><th>الموضع</th><th>أمثلة الكتاب</th></tr>
      <tr><td>الحروف</td><td>كل حرف مبدوء بهمزة عدا «أل»</td><td class="amiri">أنْ، أنّ، إنْ، إذا، أمْ، إلى، ألّا، إلّا</td></tr>
      <tr><td>الأسماء</td><td>كل اسم مبدوء بهمزة (ومنها الاستفهام والضمائر) عدا الأسماء المسموعة</td><td class="amiri">أب، أحمد، إعلان، إبراهيم · أين، أيّان، أنّى · أنتَ، أنتم، أنا</td></tr>
      <tr><td rowspan="3">الأفعال</td><td>ماضي الثلاثي المهموز ومصدره</td><td class="amiri">أمَر/أمْر، أخَذ/أخْذ، أسَر/أسْر</td></tr>
      <tr><td>ماضي الرباعي وأمره ومصدره</td><td class="amiri">أسلَم، أسلِم، إسلام · أكرَم، أكرِم، إكرام</td></tr>
      <tr><td>الأفعال المبدوءة بهمزة المضارعة</td><td class="amiri">ألعبُ، أجلسُ، أنتصرُ، أستغفرُ، أقرأُ</td></tr>
    </table>
    <p><b>ملاحظة:</b> همزة المضارعة + فعل ثلاثي مهموز = مدّ: <span class="w">آكل، آخذ، آمر</span>.</p>
  </div>
  <div class="card">
    <h2>التفريق · الاستفهام · الحروف الداخلة <span class="pg">ص 20–21</span></h2>
    <p><b>اختبار «زيادة صوت قبل الهمزة»:</b> أدخل الواو أو الفاء؛ إن سقطت الهمزة فهي وصل (<span class="w">وَثنان</span>)، وإن بقيت فهي قطع (<span class="w">وأحمد</span>).</p>
    <table>
      <tr><th>همزة الاستفهام مع</th><th>الحكم</th><th>مثال</th></tr>
      <tr><td>همزة وصل</td><td>تُحذف همزة الوصل</td><td class="amiri">أبنُ محمد هذا؟ · أسمُك أحمد؟</td></tr>
      <tr><td>«أل» التعريف</td><td>تُكتب مدًّا</td><td class="amiri">آلكتابَ قرأت؟</td></tr>
      <tr><td>همزة قطع</td><td>تثبت الهمزتان</td><td class="amiri">أأنتَ مسافر؟</td></tr>
    </table>
    <p><b>حروف لا تؤثر في أوّلية الهمزة:</b> أل (<span class="w">الإجلال</span>)، لام القسم (<span class="w">لأكرمنّ</span>)، لام الابتداء (<span class="w">لأنت الصديق</span>)، لام الجر (<span class="w">لإحسانه</span>)، الباء والكاف (<span class="w">بالأمير، كالإجلال</span>)، الواو والفاء (<span class="w">وأخذ، فاستعمل</span>).</p>
  </div>
  <div class="card">
    <h2>الهمزة المتوسطة <span class="pg">ص 26–30</span></h2>
    <p><b>قاعدة أقوى الحركات:</b> الكسرة (ئ) ← الضمة (ؤ) ← الفتحة (أ) ← السكون (ء). نقارن حركة الهمزة بحركة ما قبلها ونكتبها على ما يناسب الأقوى.</p>
    <table>
      <tr><th>الصورة</th><th>الحالة</th><th>أمثلة الكتاب</th></tr>
      <tr><td rowspan="2">ئ</td><td>مكسورة مهما كان ما قبلها</td><td class="amiri">قارئين، سئم، لئيم، سُئل، أفئدة، تائب، قائم</td></tr>
      <tr><td>ما قبلها مكسور مهما كانت حركتها</td><td class="amiri">ناشئون، فِئة، ذِئاب، متّكئان، ذِئب، بِئر</td></tr>
      <tr><td>ؤ</td><td>مضمومة بعد ضم/فتح/سكون/ألف مد · مفتوحة بعد ضم · ساكنة بعد ضم</td><td class="amiri">رؤوس، يقرؤه، مسؤول، التشاؤم · يؤاخذ، مؤسسة · مؤمن، مؤتمر</td></tr>
      <tr><td>أ</td><td>مفتوحة بعد فتح · مفتوحة بعد ساكن · ساكنة بعد فتح</td><td class="amiri">سأل، متأثر · مسألة، جرأة، فجأة · رأس، فأس، كأس</td></tr>
    </table>
    <h3>الاستثناءات <span class="pg">ص 29–30</span></h3>
    <table>
      <tr><td rowspan="4">على السطر ء</td><td>مفتوحة بعد ألف مد</td><td class="amiri">قراءة، عباءة، إضاءة، مساءلة</td></tr>
      <tr><td>مفتوحة أو مضمومة بعد واو ساكنة</td><td class="amiri">مروءة، نبوءة، مقروءة، ضوءهم</td></tr>
      <tr><td>مفتوحة بعد ساكن لا يتصل + ألف المثنى</td><td class="amiri">جزءان، ضوءان</td></tr>
      <tr><td>بين ألفين</td><td class="amiri">عباءات، إنشاءات، إجراءات</td></tr>
      <tr><td>على نبرة ئ</td><td>بعد ياء ساكنة، مهما كانت حركتها</td><td class="amiri">مشيئة، مضيئة، هيئة، مجيئك</td></tr>
      <tr><td rowspan="2">مدًّا آ</td><td>مفتوحة بعد فتح، وبعدها ألف مد أو تثنية أو جمع</td><td class="amiri">تآلف، تآكل، خطآن، ملجآن، منشآت، مكافآت</td></tr>
      <tr><td>مفتوحة بعد ساكن، وبعدها ألف مد</td><td class="amiri">مرآة، مرآب، ظمآن</td></tr>
    </table>
  </div>
  <div class="card">
    <h2>الهمزة المتطرفة <span class="pg">ص 34–35</span></h2>
    <p>تُكتب على حرف يناسب <b>حركة ما قبلها</b>: كسر ← ئ (<span class="w">شاطئ، موانئ</span>) · ضم ← ؤ (<span class="w">تباطؤ، تكافؤ</span>) · فتح ← أ (<span class="w">مبدأ، ملجأ</span>) · سكون ← ء (<span class="w">دفء، بطء، نداء</span>).</p>
    <table>
      <tr><th>تنوين النصب</th><th>الحكم</th><th>أمثلة الكتاب</th></tr>
      <tr><td>على ألف، أو على السطر بعد ألف مد</td><td>نكتفي بالتنوين</td><td class="amiri">خطأً، مبدأً، نبأً، هواءً، سماءً</td></tr>
      <tr><td>على نبرة</td><td>نبرة + ألف التنوين</td><td class="amiri">قارئًا، مبتدئًا، شاطئًا، هادئًا</td></tr>
      <tr><td>على السطر بعد حرف يتصل</td><td>تُكتب على نبرة + ألف</td><td class="amiri">عبئًا، دفئًا، بطئًا، ملئًا</td></tr>
      <tr><td>على السطر بعد حرف لا يتصل</td><td>تُزاد ألف بعدها</td><td class="amiri">هدوءًا، ضوءًا، بدءًا</td></tr>
    </table>
    <p><b>تتحول إلى متوسطة</b> باتصال الضمائر: <span class="w">يملؤها، تملئين، يملؤون · شاطئكم · سماؤنا، سماءنا، سمائنا</span>.</p>
    <p><b>مدًّا مع ألف الاثنين:</b> <span class="w">قرآ، بدآ، أنشآ، هدآ</span>.</p>
  </div>
  <h2 class="unit" id="r-hadhf">الحذف <span class="pg">ص 39–41</span></h2>
  <div class="card">
    <table>
      <tr><th>المحذوف</th><th>الموضع</th><th>أمثلة</th></tr>
      <tr><td rowspan="4">الألف</td><td>من وسط بعض الكلمات</td><td class="amiri">الله، إله، الرحمن، لكن</td></tr>
      <tr><td>ألف «ها» التنبيه مع «ذا» الإشارية، ومن «ذا» مع الكاف واللام</td><td class="amiri">هذا، هذه، هذان، هؤلاء · ذلك، ذلكم، كذلك</td></tr>
      <tr><td>الماضي الأجوف إذا اتصل به ضمير رفع متحرك</td><td class="amiri">قال ← قلتُ، قلنَ، قلنا</td></tr>
      <tr><td>«ما» الاستفهامية بعد حرف جر (بشرط ألّا يتبعها «ذا»)</td><td class="amiri">عمَّ، بِمَ، لِمَ، مِمَّ، فيمَ</td></tr>
      <tr><td rowspan="2">الواو</td><td>المضارع المعتل الآخر بالواو إذا جُزم، والأمر منه</td><td class="amiri">يدعو ← لم يدعُ، ادعُ</td></tr>
      <tr><td>أسماء تُنطق بواوين وتُكتب بواو</td><td class="amiri">داود، طاوس</td></tr>
      <tr><td rowspan="2">الياء</td><td>المنقوص النكرة في الرفع والجر (لا تُحذف في المعرفة والمنصوب)</td><td class="amiri">جاء قاضٍ · جاء القاضي · رأيت قاضيًا</td></tr>
      <tr><td>المضارع المعتل الآخر بالياء إذا جُزم، والأمر منه</td><td class="amiri">يرمي ← لم يرمِ، ارمِ</td></tr>
      <tr><td rowspan="3">«أل» وهمزتها</td><td>همزة «أل» بعد لام الجر أو لام الابتداء</td><td class="amiri">للوالدين، للعمل الصالح</td></tr>
      <tr><td>همزة «أل» بعد همزة الاستفهام، وتُعوَّض بمدّ</td><td class="amiri">آلقلمُ جديد؟</td></tr>
      <tr><td>«أل» كاملة إذا بدأت الكلمة بلام ودخلت عليها لام الجر</td><td class="amiri">لليمون، للحم</td></tr>
    </table>
  </div>
  <h2 class="unit" id="r-ziyada">الزيادة <span class="pg">ص 42–43</span></h2>
  <div class="card">
    <table>
      <tr><th>الزائد</th><th>الموضع</th><th>أمثلة</th></tr>
      <tr><td rowspan="3">الألف</td><td>مع تنوين النصب، إلا إذا خُتمت الكلمة بتاء مربوطة، أو همزة على ألف، أو همزة قبلها ألف، أو ألف لينة</td><td class="amiri">رأيت محمدًا · فاطمةً، ملجأً، سماءً، فتًى</td></tr>
      <tr><td>الألف الفارقة بعد واو الجماعة (الماضي، الأمر، المضارع المنصوب والمجزوم)</td><td class="amiri">كتبوا، اكتبوا، لن تسافروا، لم يفشلوا</td></tr>
      <tr><td>لا تُزاد بعد واو جمع المذكر السالم ولا بعد الواو الأصلية</td><td class="amiri">مهندسو، معلمو · يدعو، يرجو</td></tr>
      <tr><td rowspan="3">الواو</td><td>بعض أسماء الإشارة</td><td class="amiri">أولئك، أولاء</td></tr>
      <tr><td>الملحق بجمع المذكر السالم بمعنى أصحاب، ومؤنثه</td><td class="amiri">أولو، أولي · أولات</td></tr>
      <tr><td>«عمرو» للتفريق بينه وبين «عُمَر»، في الرفع والجر فقط</td><td class="amiri">جاء عمرٌو · رأيت عمرًا</td></tr>
    </table>
    <p><b>أنواع الواو:</b> أصلية (جزء من الكلمة: يدعو) · واو الجماعة (ضمير في الفعل: كتبوا) · واو جمع المذكر السالم (علامة إعراب في الاسم: المعلمون). الألف الفارقة بعد واو الجماعة فقط.</p>
  </div>
  <h2 class="unit" id="r-idgham">الإدغام <span class="pg">ص 47–49</span></h2>
  <div class="card">
    <p><b>مفهومه:</b> إدخال حرف في حرف، فيصبحان حرفًا واحدًا مشدّدًا في الكتابة والنطق.</p>
    <table>
      <tr><th>الكلمة</th><th>أصلها</th><th>مثال</th></tr>
      <tr><td class="amiri">ممّا، عمّا</td><td>مِن ما، عن ما (موصولة)</td><td class="amiri">استفد ممّا يقدّمه معلمك</td></tr>
      <tr><td class="amiri">ممّن، عمّن</td><td>مِن مَن، عن مَن</td><td class="amiri">عمّن تسأل؟</td></tr>
      <tr><td class="amiri">لا سيّما</td><td>لا سيّ ما</td><td class="amiri">ولا سيّما غروب الشمس</td></tr>
      <tr><td class="amiri">عمَّ، مِمَّ</td><td>عن ما، من ما (استفهامية، تُحذف ألفها)</td><td class="amiri">عمَّ تبحث؟</td></tr>
      <tr><td class="amiri">إنّما، أنّما، كأنّما، ربّما</td><td>«ما» الكافة</td><td class="amiri">إنّما العلمُ نور</td></tr>
      <tr><td class="amiri">ممّا، عمّا (زائدة)</td><td>«ما» الزائدة بعد حرف الجر</td><td class="amiri">غفل المسؤول عمّا يجب</td></tr>
      <tr><td class="amiri">ألّا، إلّا</td><td>أنْ لا، إنْ لا</td><td class="amiri">يجب ألّا تُسرع</td></tr>
    </table>
    <p><b>الفرق:</b> إذا كانت الجملة سؤالًا فـ«ما» استفهامية وتُحذف ألفها (<span class="w">عمَّ تتحدّث؟</span>)، وإذا كانت خبرًا بمعنى «الذي» فهي موصولة وتثبت ألفها (<span class="w">تحدّثتُ عمّا جرى</span>).</p>
  </div>
  <h2 class="unit" id="r-alif">الألف اللينة <span class="pg">ص 52–53</span></h2>
  <div class="card">
    <p><b>تعريفها:</b> ألف ساكنة مفتوح ما قبلها، تُكتب طويلة (ا) أو مقصورة (ى).</p>
    <table>
      <tr><th>الكلمة</th><th>الحكم</th><th>أمثلة</th></tr>
      <tr><td rowspan="2">الثلاثي</td><td>أصلها واو ← طويلة</td><td class="amiri">دعا (دعوت)، علا، رجا، عصا (عصوان)</td></tr>
      <tr><td>أصلها ياء ← مقصورة</td><td class="amiri">رمى (رميت)، جرى، هدى، فتى (فتيان)</td></tr>
      <tr><td rowspan="2">فوق الثلاثي</td><td>مقصورة دائمًا</td><td class="amiri">كبرى، مستشفى، مصطفى، استدعى</td></tr>
      <tr><td>إلا إذا سُبقت بياء ← طويلة (لئلا تجتمع ياءان)</td><td class="amiri">هدايا، زوايا، قضايا، استحيا، يحيا</td></tr>
      <tr><td>الأسماء المبنية</td><td>طويلة، إلا: لدى، متى، أنّى، الأُلى</td><td class="amiri">أنا، هنا، ماذا، إذا، مهما</td></tr>
      <tr><td>الأسماء الأعجمية</td><td>طويلة غالبًا، وبعضها مقصورة</td><td class="amiri">أمريكا، فرنسا · بخارى، كسرى</td></tr>
      <tr><td>الحروف</td><td>طويلة، إلا: على، إلى، حتى، بلى</td><td class="amiri">لا، ما، كلّا، لولا</td></tr>
    </table>
    <p><b>معرفة الأصل:</b> الفعل ← بالإسناد إلى ضمير الفاعل (دعوتُ/رميتُ) أو المضارع (يعلو/يقضي) أو المصدر (السموّ/الجري). الاسم ← بالتثنية (عصوان) أو الجمع (فتيان) أو المفرد (خطا ← خطوة).</p>
  </div>
  <h2 class="unit" id="r-ta">التاء والهاء <span class="pg">ص 58–60</span></h2>
  <div class="card">
    <p><b>طريقة التفريق:</b> صِل الكلمة بما بعدها؛ إن نُطقت تاءً فهي مربوطة (<span class="w">كلية الطب</span>)، وإن بقيت هاءً فهي هاء (<span class="w">كتاب الفقه سهل</span>).</p>
    <table>
      <tr><th>النوع</th><th>مواضعها</th><th>أمثلة</th></tr>
      <tr><td rowspan="6">التاء المبسوطة (ت)</td><td>في الفعل (تاء أصلية، أو تاء التأنيث الساكنة، أو تاء الفاعل)</td><td class="amiri">بات، سكت، كتبتْ، كتبتُ</td></tr>
      <tr><td>جمع المؤنث السالم وملحقاته</td><td class="amiri">طالبات، جامعات، أولات</td></tr>
      <tr><td>جمع التكسير المنتهي بتاء مفتوحة في مفرده</td><td class="amiri">بيوت، أوقات، أصوات</td></tr>
      <tr><td>بعض الأسماء الثلاثية ساكنة الوسط</td><td class="amiri">بيت، بنت، أخت، صوت</td></tr>
      <tr><td>بعض الأعلام الأعجمية</td><td class="amiri">بيروت، الكويت</td></tr>
      <tr><td>بعض الحروف</td><td class="amiri">ليت، لات، ثُمّتَ، رُبّتَ</td></tr>
      <tr><td rowspan="6">التاء المربوطة (ة)</td><td>الكلمة المفردة المؤنثة</td><td class="amiri">فاطمة، شجرة، سيارة</td></tr>
      <tr><td>صفة المؤنث المفرد</td><td class="amiri">فاضلة، مجتهدة</td></tr>
      <tr><td>بعض الأعلام المذكرة</td><td class="amiri">حمزة، طلحة، أسامة</td></tr>
      <tr><td>جمع التكسير الذي ليس في مفرده تاء مفتوحة</td><td class="amiri">قضاة، رماة، سعاة</td></tr>
      <tr><td>صيغة المبالغة «فعّالة»</td><td class="amiri">علّامة، رحّالة</td></tr>
      <tr><td>الظرف «ثَمّة»</td><td class="amiri">ثَمّة فرق بين الرأيين</td></tr>

    <h3>أخطاء شائعة والمسافات <span class="pg">ص 76–77</span></h3>
    <p>• لا توضع نقطة بعد <b>؟</b> أو <b>!</b> ولا قبل إغلاق التنصيص؛ فهما علامتا ختام.</p>
    <p>• لا مسافة قبل: الفاصلة، النقطة، النقطتين، المنقوطة، النقاط الثلاث، التعجب، الاستفهام؛ بل تلتصق بالكلمة قبلها.</p>
    <p>• الشرطة المائلة تُكتب متصلة بما قبلها وما بعدها.</p>
    <p>• الأقواس وشرطتا الاعتراض: الجزء الأول يلتصق بما بعده، والثاني بما قبله.</p>

PASS.k1={title:'زيارة المكتبة',t:'ذهبَ الطلابُ إلى المكتبةِ؛ ليقرؤوا كتبًا جديدة. وقد سألَ أحدُهم المسؤولَ: عمَّ يبحثُ زملاؤك؟ فأجابَ: إنّهم يبحثون عن هدايا لأساتذتهم. ثم دعا الطالبُ أصدقاءه إلى الاستماع لمحاضرة عن مرضى المستشفى، فقالوا: هذا يومٌ مفيد.'};

PASS.k3={title:'برّ الوالدين',t:'يُعدّ برُّ الوالدين من أعظم القيم التي حثّ عليها الإسلام. فالابن البارّ يسعى إلى رضا والديه، ويرعاهما في كبرهما. كما أنّه يدعو لهما دائمًا، ولا يرفع صوته عليهما. ومن صور البرّ: الإحسانُ إليهما، والإصغاءُ لحديثهما، وتلبيةُ طلباتهما. لذلك ينبغي لكلّ فردٍ أن يحرص على برّ والديه؛ لأنّ البرّ خُلُقٌ دائم يلازم الإنسان طوال حياته.'};

function paginate(list){
  const pages=[];let cur=[],part=null;
  const flush=()=>{if(cur.length)pages.push(cur);cur=[]};
  for(const q of list){
    if(q.part!==part){flush();part=q.part}
    if(q.ctx){if(cur.length&&cur[0].ctx!==q.ctx)flush();cur.push(q);continue}
    if(cur.length&&cur[0].ctx)flush();
    if(q.type==='ext'||q.type==='fix'){flush();pages.push([q]);continue}
    const cap=q.type==='essay'?2:3;
    if(cur.length&&((cur[0].type==='essay')!==(q.type==='essay')))flush();
    cur.push(q);if(cur.length>=cap)flush();
  }
  flush();return pages;
}

const _pc=new Map();
const PAGESOF=att=>{if(!_pc.has(att.id))_pc.set(att.id,paginate(LIST(att)));return _pc.get(att.id)};
const pageOf=(att,id)=>PAGESOF(att).findIndex(p=>p.some(q=>q.id===id));

function pickMock(){

function pick(count,topic,only){
  if(topic==='px')return passageQs(rnd(Object.keys(PASS)));
  let pool=poolFor(topic);if(only)pool=pool.filter(only);
  if(count>=pool.length)return pool;
  if(count<30){const quick=pool.filter(q=>!['ext','fix','essay'].includes(q.type));if(quick.length>count)pool=quick}
  const parts=PARTS.map(p=>pool.filter(q=>q.part===p.id)).filter(a=>a.length);
  const alloc=parts.map(a=>Math.floor(count*a.length/pool.length));
  let rest=count-alloc.reduce((x,y)=>x+y,0);
  for(let i=0;rest>0;i=(i+1)%parts.length){if(alloc[i]<parts[i].length){alloc[i]++;rest--}}
  const out=[];parts.forEach((a,i)=>shuffle(a.length).slice(0,alloc[i]).forEach(j=>out.push(a[j])));
  return out.sort((x,y)=>x.n-y.n);
}

/* ====================== GRADING ====================== */
function isAnswered(q,a){
  if(a===undefined||a===null)return false;
  switch(q.type){
    case 'text':case 'essay':return String(a).trim()!=='';
    case 'conv':return !!(a.w||a.t||(a.r!==undefined&&a.r!==''));
    case 'ext':return Object.values(a).some(Boolean);
    case 'fix':return Object.values(a).some(f=>f&&f.on);
    default:return true;
  }
}
function grade(q,att){
  const a=att.ans[q.id],max=PTS[q.type];
  const blank=!isAnswered(q,a);
  let got=0,info={};
  switch(q.type){
    case 'mcq':case 'tf':case 'seat':got=a===q.a?1:0;break;
    case 'text':got=q.a.some(x=>norm(x)===norm(a))?1:0;break;
    case 'conv':{const v=a||{};info.w=q.ans.some(x=>norm(x)===norm(v.w));info.t=v.t===q.t;info.r=v.r!==undefined&&v.r!==''&&+v.r===q.r;got=(info.w+info.t+info.r)/3;break}
    case 'ext':{const v=a||{};let hit=0,fp=0,keys=0;q.toks.forEach((t,i)=>{const k=t[1]||'',m=v[i]||'';if(k){keys++;if(m===k)hit++}else if(m)fp++});info={hit,fp,keys};got=max*Math.max(0,hit-fp)/keys;break}
    case 'fix':{const v=a||{};let ok=0,fp=0,errs=0;q.toks.forEach((t,i)=>{if(t[1])errs++;const f=v[i];if(!f||!f.on)return;if(t[1]){if(norm(f.v)===norm(t[1]))ok++}else fp++});info={ok,fp,errs};got=max*Math.max(0,ok-fp*.5)/errs;break}
    case 'essay':{const c=att.ess[q.id]||[];got=max*c.filter(Boolean).length/q.pts.length;if(!att.essSeen[q.id])return{got:0,max,status:'pend',blank};break}
  }
  const status=blank?'blank':got>=max-1e-9?'ok':got>0?'part':'bad';
  return{got,max,status,blank,info};
}
function totals(att){
  let got=0,ok=0,bad=0,blank=0,part=0,pend=0;const byPart={};
  PARTS.forEach(p=>byPart[p.id]={got:0,max:0});
  const L=LIST(att);let maxp=0;
  L.forEach(q=>{const g=grade(q,att);got+=g.got;maxp+=g.max;byPart[q.part].got+=g.got;byPart[q.part].max+=g.max;
    if(g.status==='ok')ok++;else if(g.status==='bad')bad++;else if(g.status==='blank')blank++;else if(g.status==='part')part++;else pend++});
  return{got,pct:100*got/maxp,ok,bad,blank,part,pend,byPart,n:L.length};
}

 ['التاء المبسوطة','كُتبت مبسوطة في «طالبات»؛ لأنها جمع مؤنث سالم.'],
 ['الهاء','«كتابه»: هاء؛ لأنها ضمير الغائب، وتُنطق هاءً وقفًا ووصلًا.'],
 ['زيادة الألف','زيدت الألف في «كتبوا»؛ لأنها ألف فارقة بعد واو الجماعة.'],
 ['عدم الزيادة','لم تُزد في «معلمو»؛ لأنّ الواو واو جمع مذكر سالم.'],
 ['حذف ألف «ما»','حُذفت ألف «ما» في «عمَّ»؛ لأنها استفهامية سُبقت بحرف جر.'],
 ['الإدغام','«ممّا» أصلها «مِن + ما»، أُدغمت النون في الميم.'],
 ['الهمزة','«سُئل»: همزة متوسطة على نبرة؛ لأنها مكسورة وما قبلها مضموم، والكسرة أقوى.'],
 ['الترقيم','وُضعت «؛» لأنّ ما بعدها تعليل لما قبلها.'],
 ['تحليل الفقرة','الفكرة الرئيسة: … · عدد الجمل: … (كل جملة تنتهي بنقطة) · أدوات الربط: … · نعم، حقّقت الترابط بأدوات الربط، والتسلسل؛ إذ بدأت بالفكرة الرئيسة ثم الأمثلة ثم النتيجة.']];
const TRAPS=['«عمَّ تتحدّث؟» (سؤال ← تُحذف الألف) لكن «تحدّثتُ عمّا جرى» (خبر ← تثبت).','«هدايا، زوايا، استحيا» بألف طويلة (سُبقت بياء).','«على، إلى، حتى، بلى» و«لدى، متى» بالألف المقصورة.','«قضاة» بتاء مربوطة، لكن «بيوت، بنت، طالبات» بتاء مبسوطة.','«مهندسو، معلمو» بلا ألف؛ «كتبوا، لن تسافروا» بألف.','«رأيتُ عمرًا» بلا واو في النصب.','«لم يدعُ، ارمِ» تُحذف الواو والياء مع الجزم والأمر.','لا نقطة بعد ؟ أو !، ولا مسافة قبل علامة الترقيم.','«؛» قبل التعليل (لأنّ)، و«:» بعد القول وقبل التعداد.','الشكل الخارجي للفقرة: المسافة البادئة، والنقطة، والهوامش، والتباعد.'];
function vPrep(){
  const t=UI.tpl,gb=(v,l)=>`<button type="button" data-act="tplg" data-v="${v}" aria-pressed="${t.f===(v==='1')}">${l}</button>`;
  const inp=(f,l,ph2)=>`<label>${l}<input class="ar" data-act="tpl" data-f="${f}" dir="rtl" autocomplete="off" spellcheck="false" placeholder="${ph2}" value="${esc(t[f])}"></label>`;
  app.innerHTML=`<div class="prep">
  <div class="pagehead"><div><div class="lbl">الاستعداد للاختبار</div><h2>اختبار منتصف الفصل: ورقي، من بداية الكتاب حتى ص 83</h2></div></div>
  <div class="jumpbar"><button type="button" data-act="jump" data-id="x-form">شكل الاختبار</button><button type="button" data-act="jump" data-id="x-pass">سؤال القطعة</button><button type="button" data-act="jump" data-id="x-mcq">سؤال الاختيار</button><button type="button" data-act="jump" data-id="x-para">سؤال الفقرة</button><button type="button" data-act="jump" data-id="x-last">قبل الدخول</button></div>
  <section class="card" id="x-form"><h2 style="font-size:1.1rem;margin-bottom:8px">شكل الاختبار</h2>
    <table class="hist"><thead><tr><th>السؤال</th><th>المطلوب</th><th>كيف تتدرب هنا</th></tr></thead><tbody>
      <tr><td><b>القطعة</b></td><td>قطعة قصيرة: أجب حسب المطلوب (استخرج، علّل، صوّب، رقّم، حلّل الفقرة)</td><td>اختر موضوع «القطعة» في الصفحة الرئيسية</td></tr>
      <tr><td><b>اختيار من متعدد</b></td><td>أسئلة على كل الدروس من ص 17 إلى ص 82</td><td>اختر «كل المواضيع» أو موضوعًا واحدًا</td></tr>
      <tr><td><b>الفقرة</b></td><td>اكتب فقرة في حدود 10 أسطر عن موضوع يُعطى في الاختبار</td><td>احفظ القالب أدناه وجرّبه على أي موضوع</td></tr>
    </tbody></table>
    <div class="row-btns" style="margin-top:14px"><button class="btn primary" data-act="mock">ابدأ نموذج اختبار كامل</button><span class="hint">قطعة + 15 سؤال اختيار + فقرة، مع التصحيح</span></div>
  </section>
  <section class="card" id="x-pass"><h2 style="font-size:1.1rem;margin-bottom:8px">سؤال القطعة: طريقة الإجابة</h2>
    <p><b>1. امسح القطعة بحثًا عن:</b></p>
    <ol class="steps"><li>أفعال تنتهي بـ«وا» (كتبوا) وأسماء بـ«و» (مهندسو).</li><li>«ما» أو «مَن» بعد حرف جر (عمّا، عمَّ، ممّن).</li><li>كلمات تنتهي بـ ا أو ى.</li><li>كلمات تنتهي بـ ة أو ت أو ه.</li><li>كلمات تبدأ بـ«لل» (للعمل، لليمون).</li><li>هذا، ذلك، لكن، أولئك، عمرو.</li><li>الهمزات، وعلامات الترقيم.</li></ol>
    <p style="margin-top:10px"><b>2. اكتب: الكلمة + القاعدة + السبب.</b> الكلمة بلا تعليل تفقد الدرجة. استعمل هذه الجمل كما هي:</p>
    <div class="tablebox"><table class="hist"><thead><tr><th>المطلوب</th><th>اكتب هكذا</th></tr></thead><tbody>${ANS_ROWS.map(r=>`<tr><td><b>${r[0]}</b></td><td>${W(r[1])}</td></tr>`).join('')}</tbody></table></div>
    <div class="row-btns" style="margin-top:14px"><button class="btn" data-act="practice" data-v="px">تدرّب على قطعة الآن</button></div>
  </section>
  <section class="card" id="x-mcq"><h2 style="font-size:1.1rem;margin-bottom:8px">سؤال الاختيار: أكثر 10 فخاخ</h2>
    <ol class="steps">${TRAPS.map(x=>`<li>${W(x)}</li>`).join('')}</ol>
    <p class="hint" style="margin-top:8px">اقرأ الخيارات الأربعة كلها قبل أن تختار، واستبعد الخطأ الواضح أولًا.</p>
    <div class="row-btns" style="margin-top:10px"><button class="btn" data-act="practice" data-v="all">تدرّب على 20 سؤالًا من كل المواضيع</button></div>
  </section>
  <section class="card" id="x-para"><h2 style="font-size:1.1rem;margin-bottom:8px">سؤال الفقرة: قالب لأي موضوع</h2>
    <p>اكتب الموضوع وسيُملأ القالب. الأجزاء الملوّنة هي التي تغيّرها في الاختبار، والباقي تحفظه كما هو.</p>
    <div class="choice" style="margin-top:8px">${gb('0','الموضوع مذكّر (الوقت، العلم)')}${gb('1','الموضوع مؤنّث (القراءة، الصحة)')}</div>
    <div class="tplform">${inp('x','الموضوع','مثال: الرياضة')}${inp('b1','فائدة 1','مثال: تقوية الجسم')}${inp('b2','فائدة 2','مثال: الراحة النفسية')}${inp('harm','ضرر الإهمال','مثال: الكسل والأمراض')}${inp('adv','نصيحة (تبدأ بفعل مضارع)','مثال: يخصّص لها وقتًا كلّ يوم')}</div>
    <div class="tplout" id="tplOut">${tplOut()}</div>
    <table class="hist" style="margin-top:12px"><thead><tr><th>الجملة</th><th>وظيفتها</th></tr></thead><tbody>
      <tr><td>يُعدّ / تُعدّ …</td><td>الجملة المفتاحية (الفكرة الرئيسة)</td></tr>
      <tr><td>فالإنسان الناجح … · كما أنّ … · وبالإضافة إلى ذلك … · أمّا إهمال … · لذلك ينبغي …</td><td>الجمل الداعمة (مع أدوات الربط)</td></tr>
      <tr><td>وبذلك يتّضح أنّ …</td><td>الجملة الختامية</td></tr>
    </tbody></table>
    <p style="margin-top:10px"><b>قائمة التحقق قبل التسليم:</b></p>
    <ol class="steps">${ESS_PTS.map(x=>`<li>${x}</li>`).join('')}</ol>
    <p class="hint">مذكّر ← مؤنّث: يُعدّ ← تُعدّ · لأنّه ← لأنّها · يؤثّر ← تؤثّر · عليه ← عليها · يساعد ← تساعد · يُسهم ← تُسهم.</p>
  </section>
  <section class="card" id="x-last"><h2 style="font-size:1.1rem;margin-bottom:8px">قبل الدخول إلى الاختبار</h2>
    <ol class="steps"><li>اقرأ السؤال مرتين، ونفّذ المطلوب بالضبط (استخرج ≠ علّل ≠ صوّب).</li><li>في القطعة: الكلمة + القاعدة + السبب، لكل كلمة.</li><li>في الفقرة: مسافة بادئة، فصحى، أدوات ربط، ونقطة في النهاية.</li><li>راجع الهمزات والتاء والألف في كل ما كتبت قبل التسليم.</li><li>لا تترك سؤالًا فارغًا؛ اكتب ما تعرفه.</li></ol>
    <div class="row-btns" style="margin-top:12px"><button class="btn primary" data-act="mock">ابدأ نموذج اختبار كامل</button><button class="btn" data-act="rules">مراجعة القواعد</button></div>
  </section></div>`;
}

/* ====================== TIMER ====================== */
function tick(){
  const att=active();if(!att)return;
  const left=att.start+DUR(att)-Date.now();
  if(left<=0){submit(true);return}
  ['timer','timer2'].forEach(id=>{const el=document.getElementById(id);if(el){el.textContent=clock(left);el.classList.toggle('low',left<5*60*1000)}});
}
setInterval(()=>{if(UI.view==='exam'||UI.view==='confirm')tick();else if(active()&&active().start+DUR(active())<=Date.now()){const a=active();a.submitted=true;a.end=a.start+DUR(a);a.auto=true;persist()}},1000);

/* ====================== THEME ====================== */
const mq=matchMedia('(prefers-color-scheme: dark)');
const effTheme=()=>D.theme||(mq.matches?'dark':'light');
function applyTheme(){if(D.theme)root.setAttribute('data-theme',D.theme);else root.removeAttribute('data-theme')}
mq.addEventListener&&mq.addEventListener('change',()=>header());
applyTheme();

/* ====================== EVENTS ====================== */
const refreshNav=()=>{const ac=document.getElementById('ansCount'),at=active();if(ac&&at)ac.textContent=LIST(at).filter(q=>isAnswered(q,at.ans[q.id])).length;const n=document.getElementById('navpanel');if(n&&UI.view==='exam'){const t=document.createElement('div');t.innerHTML=navHTML(active(),'exam');n.replaceWith(t.firstElementChild)}};
const reCard=(q,att)=>{const el=document.getElementById('card-'+q.id);if(!el)return;const t=document.createElement('div');t.innerHTML=card(q,att,UI.view!=='exam');el.replaceWith(t.firstElementChild)};
function setAns(qid,val){const att=active();if(!att)return;att.ans[qid]=val;persist();refreshNav()}

document.addEventListener('input',e=>{const t=e.target,act=t.dataset&&t.dataset.act;if(!act)return;
  if(act==='name'){D.name=t.value;persist();return}
  if(act==='tpl'){UI.tpl[t.dataset.f]=t.value;const o=document.getElementById('tplOut');if(o)o.innerHTML=tplOut();return}
  const att=active();if(!att)return;const qid=t.dataset.q;
  if(act==='text'||act==='essay')setAns(qid,t.value);
  else if(act==='conv'){const v={...(att.ans[qid]||{})};v[t.dataset.f]=t.value;setAns(qid,v)}
  else if(act==='fixv'){const v={...(att.ans[qid]||{})};v[t.dataset.i]={...v[t.dataset.i],v:t.value};setAns(qid,v)}
});
document.addEventListener('change',e=>{const t=e.target,act=t.dataset&&t.dataset.act;if(!act)return;
  if(act==='mcq'){setAns(t.dataset.q,+t.value)}
  else if(act==='conv'){const att=active();const v={...(att.ans[t.dataset.q]||{})};v[t.dataset.f]=t.value;setAns(t.dataset.q,v)}
  else if(act==='tick'){const att=D.attempts.find(a=>a.id===UI.att);if(!att)return;const c=(att.ess[t.dataset.q]||[]).slice();c[+t.dataset.j]=t.checked;att.ess[t.dataset.q]=c;att.essSeen[t.dataset.q]=true;persist();
    const q=QBY[t.dataset.q];const fb=document.querySelector('#card-'+q.id+' .fb .st');if(fb){const g=grade(q,att);fb.className='st '+(g.status==='ok'?'ok':g.status==='bad'?'bad':'part');fb.innerHTML=`درجتك في هذا السؤال · <span class="num">${fmt(g.got)} / ${g.max}</span>`}}
});
function onAct(t){
  const act=t.dataset.act,qid=t.dataset.q,att=active();
  switch(act){
    case 'theme':D.theme=effTheme()==='dark'?'light':'dark';persist();applyTheme();header();return;
    case 'home':UI.view='home';render();window.scrollTo(0,0);return;
    case 'rules':UI.view='rules';render();window.scrollTo(0,0);return;
    case 'prep':UI.view='prep';render();window.scrollTo(0,0);return;
    case 'jump':{const el=document.getElementById(t.dataset.id);el&&el.scrollIntoView({block:'start'});return}
    case 'mock':{if(active()){UI.view='home';render();window.scrollTo(0,0);return}const inp=document.getElementById('stuName');if(inp)D.name=inp.value;newAttempt(true);UI.view='exam';UI.navOpen=false;render();window.scrollTo(0,0);return}
    case 'tplg':UI.tpl.f=t.dataset.v==='1';render();return;
    case 'practice':if(active()){UI.view='home';render();window.scrollTo(0,0);return}UI.topic=t.dataset.v;UI.count=20;newAttempt();UI.view='exam';UI.navOpen=false;render();window.scrollTo(0,0);return;
    case 'start':{const inp=document.getElementById('stuName');if(inp)D.name=inp.value;newAttempt();UI.view='exam';UI.navOpen=false;render();window.scrollTo(0,0);return}
    case 'resume':UI.view='exam';render();window.scrollTo(0,0);return;
    case 'setcount':UI.count=+t.dataset.v;render();return;
    case 'settopic':UI.topic=t.dataset.v;render();return;
    case 'discard':if(!UI.discard){UI.discard=true;render();setTimeout(()=>{if(UI.discard){UI.discard=false;if(UI.view==='home')render()}},4000);return}
      UI.discard=false;D.attempts=D.attempts.filter(x=>x!==att);persist();render();return;
    case 'navtoggle':UI.navOpen=!UI.navOpen;render();return;
    case 'prev':case 'next':att.page=Math.max(0,Math.min(PAGESOF(att).length-1,att.page+(act==='next'?1:-1)));persist();render();window.scrollTo(0,0);return;
    case 'goto':{const p=+t.dataset.page;if(UI.view==='review'){UI.filter='all';UI.rpage=p;render();const c=document.getElementById('card-'+qid);c&&c.scrollIntoView({block:'start'});return}
      att.page=p;persist();UI.view='exam';render();const c=document.getElementById('card-'+qid);c?c.scrollIntoView({block:'start'}):window.scrollTo(0,0);return}
    case 'finish':UI.view='confirm';UI.navOpen=false;render();window.scrollTo(0,0);return;
    case 'backexam':UI.view='exam';render();return;
    case 'submit':submit(false);return;
    case 'flag':att.flags[qid]=!att.flags[qid];persist();t.setAttribute('aria-pressed',String(att.flags[qid]));t.textContent=att.flags[qid]?'مُعلَّم للمراجعة':'علّم للمراجعة';refreshNav();return;
    case 'tf':setAns(qid,t.dataset.v==='true');t.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===t)));return;
    case 'seat':{setAns(qid,t.dataset.ch);const q=QBY[qid];t.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===t)));const w=t.closest('.qb').querySelector('.seatword');if(w)w.textContent=q.p+t.dataset.ch+q.s;return}
    case 'tool':UI.tools[qid]=t.dataset.m;reCard(QBY[qid],att);return;
    case 'tok':{if(UI.view!=='exam')return;const q=QBY[qid],i=t.dataset.i,tool=UI.tools[qid]||q.modes[0];const v={...(att.ans[qid]||{})};v[i]=v[i]===tool?'':tool;setAns(qid,v);reCard(q,att);const n=document.querySelector(`#card-${qid} [data-i="${i}"]`);n&&n.focus();return}
    case 'fixtok':{if(UI.view!=='exam')return;const q=QBY[qid],i=t.dataset.i;const v={...(att.ans[qid]||{})};const f={v:'',...v[i]};f.on=!f.on;v[i]=f;setAns(qid,v);reCard(q,att);if(f.on){const inp=document.getElementById(`fx-${qid}-${i}`);inp&&inp.focus()}return}
    case 'openres':UI.att=t.dataset.att;UI.view='result';render();window.scrollTo(0,0);return;
    case 'review':UI.filter=t.dataset.f;UI.rpage=0;UI.view='review';render();window.scrollTo(0,0);return;
    case 'rfilter':UI.filter=t.dataset.f;UI.rpage=0;render();return;
    case 'rprev':case 'rnext':UI.rpage+=act==='rnext'?1:-1;render();window.scrollTo(0,0);return;
    case 'backres':UI.view='result';render();window.scrollTo(0,0);return;
    case 'newtry':UI.view='home';render();window.scrollTo(0,0);return;
    case 'copy':{const a=D.attempts.find(x=>x.id===UI.att),tt=totals(a);
      const txt=`نتيجة اختبار مهارات الكتابة\nالاسم: ${a.name||'طالب'}\nعدد الأسئلة: ${tt.n}\nالدرجة: ${fmt(tt.pct)} / 100 (${gradeLabel(tt.pct)})\nصحيح: ${tt.ok} · خطأ: ${tt.bad} · جزئي: ${tt.part} · بلا إجابة: ${tt.blank}\nالزمن: ${clock(a.end-a.start)}\n`+PARTS.filter(p=>tt.byPart[p.id].max>0).map(p=>`${p.title}: ${fmt(tt.byPart[p.id].got)} / ${tt.byPart[p.id].max}`).join('\n');
      const msg=document.getElementById('copyMsg'),box=document.getElementById('copyBox');
      const fallback=()=>{box.hidden=false;box.value=txt;box.select();msg.textContent='حدّد النص أدناه وانسخه يدويًّا.'};
      try{navigator.clipboard.writeText(txt).then(()=>{msg.textContent='تم نسخ النتيجة.'},fallback)}catch(err){fallback()}return}
  }
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.tagName==='INPUT'||t.tagName==='SELECT'||t.tagName==='TEXTAREA')return;if(t.disabled)return;onAct(t)});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&(e.target.dataset.act==='tok'||e.target.dataset.act==='fixtok')){e.preventDefault();onAct(e.target)}});

/* hamza keyboard */
const kbd=document.getElementById('kbd');let target=null;
document.addEventListener('focusin',e=>{if(e.target.matches('input.ar,textarea.ar')&&!e.target.disabled&&!e.target.readOnly){target=e.target;kbd.hidden=false}});
document.addEventListener('focusout',()=>{setTimeout(()=>{const a=document.activeElement;if(!a||!a.matches||!a.matches('input.ar,textarea.ar')){kbd.hidden=true;target=null}},120)});
kbd.addEventListener('mousedown',e=>e.preventDefault());
kbd.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!target)return;const s=target.selectionStart??target.value.length,en=target.selectionEnd??target.value.length;target.setRangeText(b.dataset.ch,s,en,'end');target.dispatchEvent(new Event('input',{bubbles:true}));target.focus()});

/* boot */
if(active()&&active().start+DUR(active())<=Date.now()){const a=active();a.submitted=true;a.end=a.start+DUR(a);a.auto=true;persist()}
if(location.hash==='#rules')UI.view='rules';
if(location.hash==='#prep')UI.view='prep';
render();
})();
</script>
</body>
</html>
